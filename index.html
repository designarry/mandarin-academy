<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandarin Academy Semarang</title>
    <meta name="description" content="Kursus bahasa Mandarin untuk anak, remaja, dan dewasa di Semarang dan online." />
    <script>
      /* Apply the saved theme before first paint to avoid a light/dark flash */
      try {
        var t = localStorage.getItem('theme')
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.setAttribute('data-theme', dark ? 'mandarin-dark' : 'mandarin')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
